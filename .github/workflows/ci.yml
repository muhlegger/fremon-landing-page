name: CI

on:
  push:
    branches: [main]
  pull_request:

# Só lê o repositório. Não há deploy nem segredos: o site é publicado manualmente na Vercel.
permissions:
  contents: read

jobs:
  verificacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions fixadas por hash (o Dependabot propõe as atualizações); a versão fica no comentário.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Auditoria de dependências
        run: npm audit --audit-level=moderate

      - name: Lint e formatação
        run: npm run lint

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # Gera o build, sobe o preview local e roda os testes de layout e acessibilidade.
      - name: Testes
        run: npm test
